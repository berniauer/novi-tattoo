name: 🚀 Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:            # Manueller Trigger im GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # → ghcr.io/berniauer/novi-tattoo

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Docker Image bauen & in GHCR pushen ───────────────────────────
  build:
    name: 🐳 Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # Für GHCR Push

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer-Cache → zweiter Build in ~30s statt 3min
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 2: Auf VPS deployen (via Tailscale SSH) ───────────────────────────
  deploy:
    name: 🖥️ Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production    # GitHub Environment mit Approval (optional)

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}      # Tailscale-IP: 100.x.x.x
          username: ${{ secrets.VPS_USER }}      # z.B. ubuntu oder root
          key:      ${{ secrets.VPS_SSH_KEY }}   # Privater SSH-Key (ohne Passphrase)
          timeout:  120s
          script: |
            set -e

            cd /srv/novi-tattoo

            # Neuestes Image ziehen (VPS ist via vps-first-setup.sh bereits bei GHCR eingeloggt)
            docker compose -f docker-compose.prod.yml pull novi-tattoo

            # Container neu starten (zero-downtime mit --no-deps)
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps novi-tattoo

            # Alte ungetaggte Images aufräumen
            docker image prune -f

            echo "✅ Deploy erfolgreich: $(date)"
