# ─── PRODUCTION (VPS) ────────────────────────────────────────────────────────
# Stack: Next.js + Directus
# Reverse Proxy: nginx (extern, webnet)
# HTTPS/DNS: Tailscale
#
# Vorbereitung auf dem VPS (einmalig):
#   1. Repo clonen nach /srv/novi-tattoo
#   2. .env.prod + .env.directus anlegen (siehe .env.example)
#   3. docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Next.js App ─────────────────────────────────────────────────────────────
  novi-tattoo:
    image: ghcr.io/berniauer/novi-tattoo:latest
    restart: unless-stopped
    expose:
      - "3000"
    env_file: .env.prod
    depends_on:
      directus:
        condition: service_healthy
    networks:
      - webnet
      - internal

  # ── Directus CMS ────────────────────────────────────────────────────────────
  directus:
    image: directus/directus:11
    restart: unless-stopped
    expose:
      - "8055"
    volumes:
      - directus_db:/directus/database
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    env_file: .env.directus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/server/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - webnet
      - internal

volumes:
  directus_db:
  directus_uploads:
  directus_extensions:

networks:
  webnet:
    external: true   # nginx reverse proxy läuft in diesem Netzwerk
  internal:
    driver: bridge   # interne Kommunikation Next.js ↔ Directus
